[project]
name = "documentation-injester"
version = "0.1.0"
description = "Temporal workflow for ingesting PDFs and querying them with Cohere RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cohere>=7.0.0",
    "langchain-experimental>=0.4.2",
    "numpy>=2.4.6",
    "pydantic>=2.0.0",
    "pypdf>=6.12.2",
    "python-dotenv>=1.2.2",
    "temporalio>=1.28.0",
]
